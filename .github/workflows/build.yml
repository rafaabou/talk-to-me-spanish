'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      skip_security:
        description: Skip security scans (emergency only)
        required: false
        default: 'false'
        type: boolean
env:
  FLUTTER_VERSION: 3.29.3
  JAVA_VERSION: '17'
permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write
  attestations: write
jobs:
  validate:
    name: Validate Spanish App
    runs-on:
    - self-hosted
    - linux
    - X64
    - spanish
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: gradle
    - name: Format Check
      run: dart format --set-exit-if-changed --output=none .
    - name: Static Analysis
      run: 'flutter analyze --fatal-infos

        flutter analyze --no-pub > analysis-report.txt 2>&1 || true'
    - name: Unit Tests
      run: flutter test -j 1
    - name: License Check
      run: 'dart pub global activate license_checker

        export PATH="$PATH:$HOME/.pub-cache/bin"

        lic_ck check-licenses --config lic_ck.yaml || echo "License check completed with findings"'
    - name: Secret Scan (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      with:
        cache: 'false'
    - name: Secret Scan (TruffleHog)
      uses: trufflesecurity/trufflehog@v3.97.0
      with:
        path: ./
        extra_args: --results=verified
    - name: Dependency Audit
      run: 'flutter pub outdated --json > deps-outdated.json || true

        cat deps-outdated.json'
  build:
    name: Build Spanish App
    needs: validate
    runs-on:
    - self-hosted
    - linux
    - X64
    - spanish
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: gradle
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - name: Restore Release Keystore
      run: "if [ -n \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\" ]; then\n  echo \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\"\
        \ | base64 -d > android/app/release.keystore\n  ls -la android/app/release.keystore\nelse\n  echo \"RELEASE_KEYSTORE_BASE64\
        \ not set - generating ephemeral keystore\"\n  keytool -genkeypair -v \\\n    -keystore android/app/release.keystore\
        \ \\\n    -alias release \\\n    -keyalg RSA -keysize 2048 -validity 10000 \\\n    -storepass release123 -keypass\
        \ release123 \\\n    -dname \"CN=Talk To Me Espa\xF1ol, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN\"\nfi"
    - name: Build Spanish Release APK
      run: "flutter build apk --release \\\n  --obfuscate \\\n  --split-debug-info=build/debug-info \\\n  --target-platform\
        \ android-arm64"
    - name: Verify Build Outputs
      run: 'ls -la build/app/outputs/flutter-apk/app-release.apk

        SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)

        echo "APK size: $SIZE bytes"

        test "$SIZE" -gt 1000000 || exit 1'
    - name: Lint Dockerfile (Hadolint)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/hadolint" \
          https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        chmod +x "$HOME/.local/bin/hadolint"
        "$HOME/.local/bin/hadolint" Dockerfile
      if: always()
    - name: Build Docker Image (local)
      run: docker build -t talk-to-me-spanish:${{ github.sha }} .
      if: always()
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
    - name: Scan Docker Image (Grype)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype talk-to-me-spanish:${{ github.sha }} --only-fixed --fail-on critical'
      if: always()
    - name: Generate Image SBOM (Syft)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft talk-to-me-spanish:${{ github.sha }} -o cyclonedx-json=sbom-docker.cdx.json'
      if: always()
    - name: Scan Docker Image (Trivy)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" trivy
        "$HOME/.local/bin/trivy" image \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
          talk-to-me-spanish:${{ github.sha }}
      if: always()
    - name: Scan Docker Image (Dockle)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" dockle
        docker save talk-to-me-spanish:${{ github.sha }} -o /tmp/scan.tar
        "$HOME/.local/bin/dockle" --exit-code 1 --exit-level fatal --input /tmp/scan.tar
        rm -f /tmp/scan.tar
      if: always()
  security-scan:
    name: Security Scans (Spanish)
    needs:
    - build
    runs-on:
    - self-hosted
    - linux
    - X64
    - spanish
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scanner:
        - grype
        - trivy
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/.local/bin
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
    - name: Generate SBOM (Syft)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft file:. -o cyclonedx-json=sbom-project.cdx.json

        syft file:app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-apk.cdx.json'
    - name: Vulnerability Scan (Grype)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype sbom:sbom-project.cdx.json --fail-on high

        grype sbom:sbom-apk.cdx.json --fail-on high'
  package:
    name: Package & Release Spanish App
    needs:
    - build
    - security-scan
    runs-on:
    - self-hosted
    - linux
    - X64
    - spanish
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: true
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
        cache: gradle
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    - name: Get Dependencies
      working-directory: app
      run: flutter pub get --enforce-lockfile
    - name: Restore Release Keystore
      working-directory: app
      run: "if [ -n \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\" ]; then\n  echo \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\"\
        \ | base64 -d > android/app/release.keystore\n  ls -la android/app/release.keystore\nelse\n  echo \"RELEASE_KEYSTORE_BASE64\
        \ not set - generating ephemeral keystore\"\n  keytool -genkeypair -v \\\n    -keystore android/app/release.keystore\
        \ \\\n    -alias release \\\n    -keyalg RSA -keysize 2048 -validity 10000 \\\n    -storepass release123 -keypass\
        \ release123 \\\n    -dname \"CN=Talk To Me Espa\xF1ol, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN\"\nfi"
    - name: Build Spanish Release APK
      working-directory: app
      run: "flutter build apk --release \\\n  --obfuscate \\\n  --split-debug-info=build/debug-info \\\n  --target-platform\
        \ android-arm64"
    - name: Generate SBOMs
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft file:. -o cyclonedx-json=sbom-project.cdx.json

        syft file:app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-apk.cdx.json'
    - name: Generate APK SBOM
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft file:app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-apk.cdx.json'
    - name: Vulnerability Scan on APK SBOM
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype sbom:sbom-apk.cdx.json --fail-on high'
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3
    - name: Sign APK & SBOM (Keyless)
      run: "cosign sign-blob --yes \\\n  --output-signature app-release.apk.sig \\\n  app/build/app/outputs/flutter-apk/app-release.apk\n\
        cosign sign-blob --yes \\\n  --output-signature sbom-project.cdx.json.sig \\\n  sbom-project.cdx.json"
    - name: Generate Provenance (SLSA)
      uses: slsa-framework/slsa-github-generator/actions/generate-attestations@v2
      with:
        subject-path: app/build/app/outputs/flutter-apk/app-release.apk
        provenance-name: provenance.intoto.jsonl
    - name: Upload to GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: "export PATH=\"$HOME/.local/bin:$PATH\"\nSHORT_SHA=\"${{ github.sha }}\"\nSHORT_SHA=\"${SHORT_SHA:0:8}\"\nTAG=\"\
        v${{ github.run_number }}-${SHORT_SHA}\"\ngh release create \"$TAG\" \\\n  app/build/app/outputs/flutter-apk/app-release.apk\
        \ \\\n  app-release.apk.sig \\\n  sbom-project.cdx.json \\\n  sbom-project.cdx.json.sig \\\n  sbom-apk.cdx.json \\\
        \n  provenance.intoto.jsonl \\\n  --title \"Spanish Build ${{ github.run_number }}\" \\\n  --notes \"Auto-build from\
        \ commit ${{ github.sha }}\""
  release:
    name: Release Spanish App
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
    - self-hosted
    - linux
    - X64
    - spanish
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
