'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:

# Actions minutes are billed per runner, and Windows/macOS cost 2x and 10x a
# Linux minute. A superseded run is pure waste, so cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: 3.29.3
  JAVA_VERSION: '17'
permissions: {}
jobs:
  validate:
    permissions:
      contents: read
    name: Validate Spanish App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Setup Java
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Format Check
      run: dart format --set-exit-if-changed --output=none .
    - name: Static Analysis
      run: 'flutter analyze --fatal-infos

        flutter analyze --no-pub > analysis-report.txt 2>&1 || true'
    - name: Audio Key Lint
      run: python3 tools/lint_audio_keys.py assets/course/levels es --strict
    - name: Exercise Duplicate Audit
      run: python3 tools/audit_duplicate_exercises.py es
    - name: Course Data Leak Scan
      run: |
        # Catches the other language bleeding into the course text.
        python3 - <<'PY'
        import glob, json, re, sys
        markers = re.compile(r'es', re.I | re.X)
        bad = 0
        for f in glob.glob('assets/course/levels/*.json'):
            d = json.load(open(f, encoding='utf-8'))
            def walk(node, path):
                global bad
                if isinstance(node, dict):
                    for k, v in node.items():
                        walk(v, path + [k])
                elif isinstance(node, list):
                    for i, v in enumerate(node):
                        walk(v, path + [str(i)])
                elif isinstance(node, str) and path[-1] in ('es', 'text_es', 'text_en', 'text_ar', 'text_es'):
                    if markers.search(node):
                        print(f'{f}::{"/".join(path)}: {node[:70]}')
                        bad += 1
            walk(d, [])
        print(f'{bad} suspicious string(s)')
        # A handful of genuine cross-references (Brazilian music, Pix) exist, so
        # this reports rather than fails; a large regression should be reviewed.
        PY
    - name: Web Server Security Tests
      run: python3 tools/test_serve_web.py
    - name: Gitleaks Config Test
      run: python3 tools/test_gitleaks_config.py
    - name: Unit Tests
      run: flutter test -j 1
    - name: License Check
      run: 'dart pub global activate license_checker

        export PATH="$PATH:$HOME/.pub-cache/bin"

        lic_ck check-licenses --config lic_ck.yaml || echo "License check completed with findings"'
    - name: Secret Scan (Gitleaks)
      uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
      env:
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      with:
        cache: 'false'
    - name: Secret Scan (TruffleHog)
      uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
      with:
        path: ./
        extra_args: --results=verified
    - name: Dependency Audit
      run: 'flutter pub outdated --json > deps-outdated.json || true

        cat deps-outdated.json'
  build:
    permissions:
      contents: read
    name: Build Spanish App
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Setup Java
      uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    - name: Setup Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - name: Restore Release Keystore
      run: |
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          ls -la android/app/release.keystore
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "Pull request build: throwaway keystore, never published."
          keytool -genkeypair -v \
            -keystore android/app/release.keystore \
            -alias release \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ci-throwaway-not-a-release-key -keypass ci-throwaway-not-a-release-key \
            -dname "CN=CI Throwaway, OU=CI, O=CI, C=TN"
        else
          echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Refusing to sign a release build with a throwaway key."
          exit 1
        fi
    - name: Build Spanish Release APK
      run: "flutter build apk --release \\\n  --obfuscate \\\n  --split-debug-info=build/debug-info \\\n  --target-platform\
        \ android-arm64"
    - name: Verify Build Outputs
      run: 'ls -la build/app/outputs/flutter-apk/app-release.apk

        SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)

        echo "APK size: $SIZE bytes"

        test "$SIZE" -gt 1000000 || exit 1'
    - name: Stage APK into Docker context
      run: cp build/app/outputs/flutter-apk/app-release.apk ./app-release.apk
    - name: Upload Android APK
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-apk
        path: app/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7
        if-no-files-found: error
    - name: Lint Dockerfile (Hadolint)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/hadolint" \
          https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        chmod +x "$HOME/.local/bin/hadolint"
        sync && sleep 2
        "$HOME/.local/bin/hadolint" Dockerfile
      if: always()
      continue-on-error: true
    - name: Build Docker Image (local)
      run: DOCKER_BUILDKIT=1 docker build -t talk-to-me-spanish:${{ github.sha }} .
      if: always()
      continue-on-error: true
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/v0.104.1/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
      continue-on-error: true
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.29.0/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Grype)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype talk-to-me-spanish:${{ github.sha }} --only-fixed --fail-on critical'
      if: always()
      continue-on-error: true
    - name: Generate Image SBOM (Syft)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft talk-to-me-spanish:${{ github.sha }} -o cyclonedx-json=sbom-docker.cdx.json'
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Trivy)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" trivy
        sync && sleep 2
        "$HOME/.local/bin/trivy" image \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
          talk-to-me-spanish:${{ github.sha }}
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Dockle)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" dockle
        sync && sleep 2
        docker save talk-to-me-spanish:${{ github.sha }} -o /tmp/scan.tar
        "$HOME/.local/bin/dockle" --exit-code 1 --exit-level fatal --input /tmp/scan.tar
        rm -f /tmp/scan.tar
      if: always()
      continue-on-error: true
  desktop:
    # Desktop packaging runs on the expensive Windows and macOS runners, so it
    # is limited to real releases: a push to main or a version tag. Pull
    # requests validate the Dart and Python side only.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    name: Build Desktop Spanish App (${{ matrix.os }})
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Install Linux desktop dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev cmake ninja-build clang pkg-config libgstreamer1.0-dev gstreamer1.0-plugins-good
    - name: Enable desktop support
      run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Build Linux Desktop
      if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      run: flutter build linux --release
    - name: Build Linux AppImage
      if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq plocate file wget
        sudo updatedb || true
        mkdir -p /tmp/aibin
        wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/aibin/appimagetool
        chmod +x /tmp/aibin/appimagetool
        (cd /tmp/aibin && ./appimagetool --appimage-extract > /dev/null)
        mkdir -p /tmp/airoot && ln -sf /tmp/aibin/squashfs-root/AppRun /tmp/airoot/appimagetool
        export PATH="/tmp/airoot:$PATH"
        dart pub global activate fastforge
        export PATH="$PATH:$HOME/.pub-cache/bin"
        fastforge package --platform=linux --targets=appimage
        ls -la dist/
    - name: Upload Linux AppImage
      if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-linux-appimage
        path: app/dist/**/*.AppImage
        retention-days: 7
    - name: Build Windows Desktop
      if: matrix.os == 'windows-2022' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      run: flutter build windows --release
    - name: Build macOS Desktop
      if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      run: flutter build macos --release
    - name: Upload Linux bundle
      if: matrix.os == 'ubuntu-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-linux-desktop
        path: app/build/linux/x64/release/bundle/
        retention-days: 7
    - name: Upload Windows bundle
      if: matrix.os == 'windows-2022' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-windows-desktop
        path: app/build/windows/x64/runner/Release/
        retention-days: 7
    - name: Upload macOS bundle
      if: matrix.os == 'macos-latest' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[desktop]')))
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-macos-desktop
        path: app/build/macos/Build/Products/Release/
        retention-days: 7
  web:
    permissions:
      contents: read
    name: Build Web Spanish App
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Setup Flutter
      uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Enable web support
      run: flutter config --enable-web
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Build Web
      run: flutter build web --release --pwa-strategy=offline-first --no-web-resources-cdn
    - name: Repair double-nested assets
      run: |
        # Flutter nests these as assets/assets/<dir> while the AssetManifest
        # maps them to assets/<dir>; without this the .opus files 404.
        for dir in audio course; do
          if [ -d "build/web/assets/assets/$dir" ] && [ ! -e "build/web/assets/$dir" ]; then
            (cd build/web/assets && ln -s "assets/$dir" "$dir")
          fi
        done
        ls -la build/web/assets
    - name: Stamp version.json
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*: //; s/+.*//')
        BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
        printf '{"app_name":"talk_to_me_spanish","version":"%s","build_number":"%s","package_name":"talk_to_me_spanish"}' "$VERSION" "$BUILD" > build/web/version.json
        cat build/web/version.json
    - name: Verify bundled fonts
      run: |
        grep -q NotoSans build/web/assets/FontManifest.json
        grep -q NotoSansArabic build/web/assets/FontManifest.json
    - name: Upload web bundle
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: es-web
        path: app/build/web/
        retention-days: 7
  package:
    name: Package & Release Spanish App
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    # The build job already produced a signed APK; rebuilding it here doubled
    # the Flutter build time on every push.
    - name: Download Android APK
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: es-apk
        path: app/build/app/outputs/flutter-apk
    - name: Install Grype & Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/v0.104.1/install.sh | sh -s -- -b $HOME/.local/bin
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.29.0/install.sh | sh -s -- -b $HOME/.local/bin
    - name: Generate SBOMs
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft dir:. --exclude "./app/build/**" -o cyclonedx-json=sbom-project.cdx.json

        syft file:app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-apk.cdx.json'
    - name: Vulnerability Scan on APK SBOM
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype sbom:sbom-apk.cdx.json --fail-on high'
    - name: Install Cosign
      uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
    - name: Sign APK & SBOM (Keyless)
      run: "cosign sign-blob --yes \\\n  --output-signature app-release.apk.sig \\\n  app/build/app/outputs/flutter-apk/app-release.apk\n\
        cosign sign-blob --yes \\\n  --output-signature sbom-project.cdx.json.sig \\\n  sbom-project.cdx.json"
    - name: Upload release artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: release-artifacts
        path: |
          app/build/app/outputs/flutter-apk/app-release.apk
          app-release.apk.sig
          sbom-project.cdx.json
          sbom-project.cdx.json.sig
          sbom-apk.cdx.json
        retention-days: 7
  release:
    name: Release Spanish App
    needs:
    - package
    - desktop
    # Desktop artifacts are optional; the APK and SBOMs must still ship.
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.package.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Download release artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: release-artifacts
        path: artifacts
    - name: Download desktop artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: es-*
        path: desktop-artifacts
      continue-on-error: true
    - name: Prepare desktop bundles (optional)
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq zip > /dev/null 2>&1
        [ -d desktop-artifacts/es-linux-desktop ] && (cd desktop-artifacts/es-linux-desktop && zip -qr ../../TalkToMeES-linux.zip .) || echo "no linux bundle, skipping"
        [ -d desktop-artifacts/es-windows-desktop ] && (cd desktop-artifacts/es-windows-desktop && zip -qr ../../TalkToMeES-windows.zip .) || echo "no windows bundle, skipping"
        [ -d desktop-artifacts/es-macos-desktop ] && (cd desktop-artifacts/es-macos-desktop && zip -qr ../../TalkToMeES-macos.zip .) || echo "no macos bundle, skipping"
        APPIMAGE=$(find desktop-artifacts/es-linux-appimage -name "*.AppImage" 2>/dev/null | head -1)
        [ -n "$APPIMAGE" ] && cp "$APPIMAGE" ./TalkToMeES.AppImage && chmod +x ./TalkToMeES.AppImage || echo "no appimage, skipping"
        ls -la TalkToMeES-*.zip TalkToMeES.AppImage 2>/dev/null || true
    - name: Create tag & GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null 2>&1
        VERSION=$(grep '^version:' app/pubspec.yaml | sed 's/.*: //; s/+.*//')
        BUILD=$(grep '^version:' app/pubspec.yaml | sed 's/.*+//')
        TAG="v$VERSION"
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        # The token goes through an explicit header, never into the remote URL.
        git remote set-url origin "https://github.com/${{ github.repository }}.git"
        AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
        if git rev-parse "$TAG" > /dev/null 2>&1; then
          if [ "$(git rev-list -n1 "$TAG")" != "${{ github.sha }}" ]; then
            echo "::error::Tag $TAG already exists on another commit. Bump version in app/pubspec.yaml."
            exit 1
          fi
        else
          git tag "$TAG" "${{ github.sha }}"
          git -c http.extraheader="$AUTH" push origin "$TAG"
        fi
        FILES="artifacts/app/build/app/outputs/flutter-apk/app-release.apk artifacts/app-release.apk.sig artifacts/sbom-project.cdx.json artifacts/sbom-project.cdx.json.sig artifacts/sbom-apk.cdx.json"
        NOTES="## v$VERSION (build $BUILD)
        By **Mohamed Rafaa Tounekti**

        ### Downloads
        - **Android**: app-release.apk (arm64, Cosign keyless signed)"
        for asset in TalkToMePT.AppImage TalkToMePT-linux.zip TalkToMePT-windows.zip TalkToMePT-macos.zip; do
          if [ -f "$asset" ]; then FILES="$FILES $asset"; fi
        done
        if gh release view "$TAG" > /dev/null 2>&1; then
          gh release upload "$TAG" $FILES --clobber
          gh release edit "$TAG" --notes "$NOTES"
        else
          gh release create "$TAG" $FILES \
            --title "Talk To Me v$VERSION" \
            --notes "$NOTES"
        fi