'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch:
    inputs:
      skip_security:
        description: Skip security scans (emergency only)
        required: false
        default: 'false'
        type: boolean
env:
  FLUTTER_VERSION: 3.29.3
  JAVA_VERSION: '17'
permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write
jobs:
  validate:
    name: Validate Spanish App
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Format Check
      run: dart format --set-exit-if-changed --output=none .
    - name: Static Analysis
      run: 'flutter analyze --fatal-infos

        flutter analyze --no-pub > analysis-report.txt 2>&1 || true'
    - name: Unit Tests
      run: flutter test -j 1
    - name: License Check
      run: 'dart pub global activate license_checker

        export PATH="$PATH:$HOME/.pub-cache/bin"

        lic_ck check-licenses --config lic_ck.yaml || echo "License check completed with findings"'
    - name: Secret Scan (Gitleaks)
      uses: gitleaks/gitleaks-action@v2
      env:
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      with:
        cache: 'false'
    - name: Secret Scan (TruffleHog)
      uses: trufflesecurity/trufflehog@v3.97.0
      with:
        path: ./
        extra_args: --results=verified
    - name: Dependency Audit
      run: 'flutter pub outdated --json > deps-outdated.json || true

        cat deps-outdated.json'
  build:
    name: Build Spanish App
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - name: Restore Release Keystore
      run: "if [ -n \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\" ]; then\n  echo \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\"\
        \ | base64 -d > android/app/release.keystore\n  ls -la android/app/release.keystore\nelse\n  echo \"RELEASE_KEYSTORE_BASE64\
        \ not set - generating ephemeral keystore\"\n  keytool -genkeypair -v \\\n    -keystore android/app/release.keystore\
        \ \\\n    -alias release \\\n    -keyalg RSA -keysize 2048 -validity 10000 \\\n    -storepass release123 -keypass\
        \ release123 \\\n    -dname \"CN=Talk To Me Espa\xF1ol, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN\"\nfi"
    - name: Build Spanish Release APK
      run: "flutter build apk --release \\\n  --obfuscate \\\n  --split-debug-info=build/debug-info \\\n  --target-platform\
        \ android-arm64"
    - name: Verify Build Outputs
      run: 'ls -la build/app/outputs/flutter-apk/app-release.apk

        SIZE=$(stat -c%s build/app/outputs/flutter-apk/app-release.apk)

        echo "APK size: $SIZE bytes"

        test "$SIZE" -gt 1000000 || exit 1'
    - name: Stage APK into Docker context
      run: cp build/app/outputs/flutter-apk/app-release.apk ./app-release.apk
    - name: Lint Dockerfile (Hadolint)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL -o "$HOME/.local/bin/hadolint" \
          https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        chmod +x "$HOME/.local/bin/hadolint"
        sync && sleep 2
        "$HOME/.local/bin/hadolint" Dockerfile
      if: always()
      continue-on-error: true
    - name: Build Docker Image (local)
      run: DOCKER_BUILDKIT=1 docker build -t talk-to-me-spanish:${{ github.sha }} .
      if: always()
      continue-on-error: true
    - name: Install Grype
      run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
      continue-on-error: true
    - name: Install Syft
      run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Grype)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype talk-to-me-spanish:${{ github.sha }} --only-fixed --fail-on critical'
      if: always()
      continue-on-error: true
    - name: Generate Image SBOM (Syft)
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft talk-to-me-spanish:${{ github.sha }} -o cyclonedx-json=sbom-docker.cdx.json'
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Trivy)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" trivy
        sync && sleep 2
        "$HOME/.local/bin/trivy" image \
          --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
          talk-to-me-spanish:${{ github.sha }}
      if: always()
      continue-on-error: true
    - name: Scan Docker Image (Dockle)
      run: |
        mkdir -p "$HOME/.local/bin"
        curl -fsSL https://github.com/goodwithtech/dockle/releases/download/v0.4.14/dockle_0.4.14_Linux-64bit.tar.gz \
          | tar xz -C "$HOME/.local/bin" dockle
        sync && sleep 2
        docker save talk-to-me-spanish:${{ github.sha }} -o /tmp/scan.tar
        "$HOME/.local/bin/dockle" --exit-code 1 --exit-level fatal --input /tmp/scan.tar
        rm -f /tmp/scan.tar
      if: always()
      continue-on-error: true
  desktop:
    name: Build Desktop Spanish App (${{ matrix.os }})
    needs: validate
    strategy:
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Install Linux desktop dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-3-dev cmake ninja-build clang pkg-config libgstreamer1.0-dev gstreamer1.0-plugins-good
    - name: Enable desktop support
      run: flutter config --enable-linux-desktop --enable-windows-desktop --enable-macos-desktop
    - name: Get Dependencies
      run: flutter pub get --enforce-lockfile
    - name: Build Linux Desktop
      if: matrix.os == 'ubuntu-latest'
      run: flutter build linux --release
    - name: Build Linux AppImage
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq plocate file wget
        sudo updatedb || true
        mkdir -p /tmp/aibin
        wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/aibin/appimagetool
        chmod +x /tmp/aibin/appimagetool
        (cd /tmp/aibin && ./appimagetool --appimage-extract > /dev/null)
        mkdir -p /tmp/airoot && ln -sf /tmp/aibin/squashfs-root/AppRun /tmp/airoot/appimagetool
        export PATH="/tmp/airoot:$PATH"
        dart pub global activate fastforge
        export PATH="$PATH:$HOME/.pub-cache/bin"
        fastforge package --platform=linux --targets=appimage
        ls -la dist/
    - name: Upload Linux AppImage
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: es-linux-appimage
        path: app/dist/**/*.AppImage
        retention-days: 7
    - name: Build Windows Desktop
      if: matrix.os == 'windows-2022'
      run: flutter build windows --release
    - name: Build macOS Desktop
      if: matrix.os == 'macos-latest'
      run: flutter build macos --release
    - name: Upload Linux bundle
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: es-linux-desktop
        path: app/build/linux/x64/release/bundle/
        retention-days: 7
    - name: Upload Windows bundle
      if: matrix.os == 'windows-2022'
      uses: actions/upload-artifact@v4
      with:
        name: es-windows-desktop
        path: app/build/windows/x64/runner/Release/
        retention-days: 7
    - name: Upload macOS bundle
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: es-macos-desktop
        path: app/build/macos/Build/Products/Release/
        retention-days: 7
  package:
    name: Package & Release Spanish App
    needs:
    - build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: stable
        cache: false
    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ env.JAVA_VERSION }}
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Accept Android Licenses
      run: yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - name: Install unzip
      run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip > /dev/null 2>&1
    - name: Get Dependencies
      working-directory: app
      run: flutter pub get --enforce-lockfile
    - name: Restore Release Keystore
      working-directory: app
      run: "if [ -n \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\" ]; then\n  echo \"${{ secrets.RELEASE_KEYSTORE_BASE64 }}\"\
        \ | base64 -d > android/app/release.keystore\n  ls -la android/app/release.keystore\nelse\n  echo \"RELEASE_KEYSTORE_BASE64\
        \ not set - generating ephemeral keystore\"\n  keytool -genkeypair -v \\\n    -keystore android/app/release.keystore\
        \ \\\n    -alias release \\\n    -keyalg RSA -keysize 2048 -validity 10000 \\\n    -storepass release123 -keypass\
        \ release123 \\\n    -dname \"CN=Talk To Me Espa\xF1ol, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN\"\nfi"
    - name: Build Spanish Release APK
      working-directory: app
      run: "flutter build apk --release \\\n  --obfuscate \\\n  --split-debug-info=build/debug-info \\\n  --target-platform\
        \ android-arm64"
    - name: Install Grype & Syft
      run: |
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/.local/bin
        curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b $HOME/.local/bin
    - name: Generate SBOMs
      run: 'export PATH="$HOME/.local/bin:$PATH"

        syft dir:. -o cyclonedx-json=sbom-project.cdx.json

        syft file:app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-apk.cdx.json'
    - name: Vulnerability Scan on APK SBOM
      run: 'export PATH="$HOME/.local/bin:$PATH"

        grype sbom:sbom-apk.cdx.json --fail-on high'
    - name: Install Cosign
      uses: sigstore/cosign-installer@v3
    - name: Sign APK & SBOM (Keyless)
      run: "cosign sign-blob --yes \\\n  --output-signature app-release.apk.sig \\\n  app/build/app/outputs/flutter-apk/app-release.apk\n\
        cosign sign-blob --yes \\\n  --output-signature sbom-project.cdx.json.sig \\\n  sbom-project.cdx.json"
    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: |
          app/build/app/outputs/flutter-apk/app-release.apk
          app-release.apk.sig
          sbom-project.cdx.json
          sbom-project.cdx.json.sig
          sbom-apk.cdx.json
        retention-days: 7
  release:
    name: Release Spanish App
    needs:
    - package
    - desktop
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-artifacts
        path: artifacts
    - name: Download desktop artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: es-*
        path: desktop-artifacts
    - name: Zip desktop bundles
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq zip > /dev/null 2>&1
        (cd desktop-artifacts/es-linux-desktop && zip -qr ../../TalkToMeES-linux.zip .)
        (cd desktop-artifacts/es-windows-desktop && zip -qr ../../TalkToMeES-windows.zip .)
        (cd desktop-artifacts/es-macos-desktop && zip -qr ../../TalkToMeES-macos.zip .)
        cp $(find desktop-artifacts/es-linux-appimage -name "*.AppImage" | head -1) ./TalkToMeES.AppImage
        chmod +x ./TalkToMeES.AppImage
        ls -la TalkToMeES-*.zip TalkToMeES.AppImage
    - name: Create tag & GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq gh > /dev/null 2>&1
        TAG="v1.6.0"
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/rafaabou/talk-to-me-spanish.git"
        gh release delete "$TAG" --yes 2>/dev/null || true
        git push origin --delete "$TAG" 2>/dev/null || true
        git tag -d "$TAG" 2>/dev/null || true
        git tag -f "$TAG" "${{ github.sha }}"
        git push origin -f "$TAG"
        gh release create "$TAG" \
          artifacts/app/build/app/outputs/flutter-apk/app-release.apk \
          artifacts/app-release.apk.sig \
          artifacts/sbom-project.cdx.json \
          artifacts/sbom-project.cdx.json.sig \
          artifacts/sbom-apk.cdx.json \
          TalkToMeES-linux.zip \
          TalkToMeES-windows.zip \
          TalkToMeES-macos.zip \
          TalkToMeES.AppImage \
          --title "Talk To Me Spanish By Mohamed Rafaa Tounekti" \
          --notes "## Talk To Me Spanish v1.6.0
          By **Mohamed Rafaa Tounekti**

          ### Downloads
          - **Android**: app-release.apk
          - **Linux**: TalkToMeES.AppImage (recommended - chmod +x and double-click, runs on any distro) or TalkToMeES-linux.zip (unzip and run)
          - **Windows**: TalkToMeES-windows.zip (unzip and run .exe)
          - **macOS**: TalkToMeES-macos.zip (unzip and open .app)

          ### What's New in v1.6.0
          - Desktop apps for Linux, Windows, and macOS
          - Web audio fix - .opus playback via HTML5 Audio with correct MIME types
          - serve_web.py ships correct MIME types for audio and fonts
          - Version display fixed across app and landing page

          ### Previous Features (v1.5.0)
          - Bottom navigation bar (Inicio / Cartas / Verbos / Estadisticas / Cuenta)
          - 17 achievement badges with unlock tracking
          - Common Verbs filter with color-coded type badges
          - Enhanced verb detail screen with summary header
          - Speaking exercises with progress tracking
          - Account screen with export/import/share/clear data
          - Flashcard and quiz review counters
          - 1,816 verbs with 8 tenses
          - Web support - run directly in your browser
          - Trilingual display (Spanish + English + Arabic)
          - Flashcard review with FSRS spaced repetition
          - Quiz mode with best score tracking
          - Offline support

          ### Technical
          - Built with Flutter 3.29.3
          - Signed APK with Cosign keyless signing
          - SBOM + vulnerability scanning included
          - CI/CD: validate -> build -> scan -> package -> release"