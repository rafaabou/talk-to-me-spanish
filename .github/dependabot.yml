# Dependabot configuration for Talk To Me Spanish
# Automated dependency updates for Flutter/Dart and GitHub Actions

version: 2
updates:
  # Dart/Flutter dependencies (pubspec.yaml)
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "dart"
      - "flutter"
      - "espanol"
    reviewers:
      - "rafaabou"
    assignees:
      - "rafaabou"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore major version updates for breaking changes
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    commit-message:
      prefix: "deps(dart):"
      prefix-development: "deps(dart) [dev]:"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
      - "espanol"
    commit-message:
      prefix: "deps(ci):"
      include: "scope"
    reviewers:
      - "rafaabou"
    assignees:
      - "rafaabou"
    open-pull-requests-limit: 5

  # Docker dependencies (Dockerfile)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    labels:
      - "dependencies"
      - "docker"
      - "devops"
      - "espanol"
    commit-message:
      prefix: "deps(docker):"
      include: "scope"
    reviewers:
      - "rafaabou"
    assignees:
      - "rafaabou"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"