# Gitleaks configuration for Talk To Me.
#
# The default rule set is used on purpose. This file only narrows *paths* that
# hold generated data, so real secrets in Dart code, workflows, Gradle files and
# documentation are actually scanned. An earlier version allowlisted whole
# extensions (*.json, *.yaml, *.md, *.lock) plus terms such as "test", "123"
# and "build/", which meant almost nothing was ever checked.
#
# tools/test_gitleaks_config.py guards this file against regressing to that.
title = "Talk To Me gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Generated data and vendored lockfiles carry no secrets"
paths = [
  '''app/assets/audio/''',
  '''app/assets/course/''',
  '''(^|/)pubspec\.lock$''',
  '''(^|/)app/build/''',
  '''(^|/)app/\.dart_tool/''',
  '''(^|/)app/windows/flutter/ephemeral/''',
  '''(^|/)app/linux/flutter/ephemeral/''',
  '''(^|/)app/macos/Flutter/ephemeral/''',
]
regexTarget = "match"
regexes = [
  # The documented, deliberately non-secret password the CI throwaway keystore
  # uses for pull-request builds. It never signs a published artifact.
  '''ci-throwaway-not-a-release-key''',
]
