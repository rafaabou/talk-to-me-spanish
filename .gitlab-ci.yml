# GitLab CI/CD for Talk To Me Español
# Mirrors GitHub Actions: validate → build → scan → package (GitLab Release) → release (tags)

stages:
  - validate
  - build
  - scan
  - package
  - release

variables:
  FLUTTER_VERSION: "3.29.3"
  JAVA_VERSION: "17"
  FLUTTER_CHANNEL: "stable"
  ANDROID_SDK_ROOT: "/opt/android-sdk"
  ANDROID_HOME: "/opt/android-sdk"
  GRADLE_OPTS: "-Xmx2g -XX:MaxMetaspaceSize=512m"

# ────────────────────────────────────────────────────────────────────────────
# Shared setup (reusable)
# ────────────────────────────────────────────────────────────────────────────
.setup: &setup
  before_script:
    - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless unzip curl git python3 python3-pip 2>/dev/null | tail -5
    - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
    - export PATH="$JAVA_HOME/bin:$PATH"
    - |
      if [ ! -d "/opt/flutter" ]; then
        curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar xJ -C /opt
      fi
    - export PATH="/opt/flutter/bin:$PATH"
    - flutter config --no-analytics
    - flutter doctor -v
    - |
      if [ ! -d "$ANDROID_SDK_ROOT" ]; then
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
        unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
      fi
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" > /dev/null

.cache: &cache
  key: "${CI_PROJECT_ID}-flutter-es-${CI_COMMIT_REF_SLUG}"
  paths:
    - /root/.pub-cache/
    - /root/.flutter/
    - /root/.gradle/
    - /opt/flutter/
    - /opt/android-sdk/
  policy: pull-push

# ────────────────────────────────────────────────────────────────────────────
# STAGE 1: VALIDATE
# ────────────────────────────────────────────────────────────────────────────
validate:
  stage: validate
  image: ubuntu:22.04
  timeout: 15m
  tags: [spanish]
  cache: *cache
  <<: *setup
  script:
    - echo "=== FORMAT CHECK ==="
    - cd app && dart format --set-exit-if-changed --output=none .
    - echo "=== STATIC ANALYSIS ==="
    - cd app && flutter analyze --fatal-infos
    - echo "=== UNIT TESTS ==="
    - cd app && flutter test
    - echo "=== LICENSE CHECK ==="
    - cd app && dart pub global activate license_checker
    - cd app && dart pub global run license_checker:lic_ck check-licenses --config lic_ck.yaml || echo "License check completed with findings"
    - echo "=== SECRET SCAN (GITLEAKS) ==="
    - |
      curl -sL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_Linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      gitleaks detect --source . --verbose --config .gitleaks.toml --no-git
    - echo "=== SECRET SCAN (TRUFFLEHOG) ==="
    - |
      curl -sL "https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin trufflehog
      trufflehog filesystem . --fail --results=verified
    - echo "=== DEPENDENCY AUDIT ==="
    - cd app && flutter pub outdated --json > deps-outdated.json || true
    - cat deps-outdated.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# ────────────────────────────────────────────────────────────────────────────
# STAGE 2: BUILD (compiles APK, no artifact upload)
# ────────────────────────────────────────────────────────────────────────────
build:
  stage: build
  image: ubuntu:22.04
  timeout: 30m
  tags: [spanish]
  cache: *cache
  needs: [validate]
  <<: *setup
  script:
    - echo "=== GET DEPENDENCIES ==="
    - cd app && flutter pub get --enforce-lockfile
    - echo "=== RESTORE RELEASE KEYSTORE ==="
    - |
      if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
        ls -la app/android/app/release.keystore
      else
        echo "RELEASE_KEYSTORE_BASE64 not set - generating ephemeral keystore"
        keytool -genkeypair -v \
          -keystore app/android/app/release.keystore \
          -alias release \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass release123 -keypass release123 \
          -dname "CN=Talk To Me Español, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN"
      fi
    - echo "=== BUILD SPANISH APK ==="
    - cd app
    - flutter build apk --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm64
    - echo "=== VERIFY BUILD OUTPUTS ==="
    - ls -la app/build/app/outputs/flutter-apk/app-release.apk
    - SIZE=$(stat -c%s app/build/app/outputs/flutter-apk/app-release.apk)
    - echo "APK size: $SIZE bytes"
    - test "$SIZE" -gt 1000000 || exit 1
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

# ────────────────────────────────────────────────────────────────────────────
# STAGE 3: SECURITY SCANS (parallel, no artifact uploads)
# ────────────────────────────────────────────────────────────────────────────
grype-scan:
  stage: scan
  image: anchore/grype:latest
  timeout: 20m
  tags: [spanish]
  needs: [build]
  script:
    - echo "=== GENERATE SBOM (SYFT) ==="
    - syft . -o cyclonedx-json=sbom-project.cdx.json
    - syft app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-es-apk.cdx.json
    - echo "=== VULNERABILITY SCAN (GRYPE) ==="
    - grype sbom:sbom-project.cdx.json --fail-on high --output json > grype-project-report.json
    - grype sbom:sbom-es-apk.cdx.json --fail-on high --output json > grype-es-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

trivy-scan:
  stage: scan
  image: aquasec/trivy:latest
  timeout: 20m
  tags: [spanish]
  needs: [build]
  script:
    - echo "=== TRIVY FS SCAN ==="
    - trivy fs --severity HIGH,CRITICAL --format sarif -o trivy-results.sarif .
    - trivy fs --severity HIGH,CRITICAL --format json -o trivy-results.json .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

# ────────────────────────────────────────────────────────────────────────────
# STAGE 4: PACKAGE & RELEASE (uploads to GitLab Release, not artifacts)
# ────────────────────────────────────────────────────────────────────────────
package:
  stage: package
  image: ubuntu:22.04
  timeout: 20m
  tags: [spanish]
  cache: *cache
  needs: [build, grype-scan, trivy-scan]
  <<: *setup
  script:
    - echo "=== RE-BUILD APK (clean, ensures keystore) ==="
    - cd app && flutter pub get --enforce-lockfile
    - |
      if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
      else
        keytool -genkeypair -v \
          -keystore app/android/app/release.keystore \
          -alias release \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass release123 -keypass release123 \
          -dname "CN=Talk To Me Español, OU=DevOps, O=Mohamed Rafaa TOUNEKTI, L=Tunis, C=TN"
      fi
    - cd app
    - flutter build apk --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm64
    - echo "=== GENERATE SBOMs ==="
    - syft . -o cyclonedx-json=sbom-project.cdx.json
    - syft app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-es-apk.cdx.json
    - echo "=== VULNERABILITY SCAN ON APK SBOM ==="
    - grype sbom:sbom-es-apk.cdx.json --fail-on high
    - echo "=== SIGN WITH COSIGN (KEYLESS) ==="
    - curl -sL "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64" -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
    - cosign sign-blob --yes --output-signature app-release.apk.sig app/build/app/outputs/flutter-apk/app-release.apk
    - cosign sign-blob --yes --output-signature sbom-project.cdx.json.sig sbom-project.cdx.json
    - echo "=== GENERATE PROVENANCE (SLSA) ==="
    - curl -sL "https://github.com/slsa-framework/slsa-verifier/releases/latest/download/slsa-verifier-linux-amd64" -o /usr/local/bin/slsa-verifier && chmod +x /usr/local/bin/slsa-verifier
    - slsa-verifier generate-provenance app/build/app/outputs/flutter-apk/app-release.apk --output provenance.intoto.jsonl
    - echo "=== UPLOAD TO GITLAB RELEASE ==="
    - |
      TAG="v${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
      if ! release-cli list --project "${CI_PROJECT_ID}" | grep -q "^$TAG$"; then
        release-cli create \
          --name "Spanish Build ${CI_PIPELINE_ID}" \
          --tag-name "$TAG" \
          --description "Auto-build from commit ${CI_COMMIT_SHA}" \
          --assets-link "{\"name\":\"talk-to-me-espanol.apk\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/app/build/app/outputs/flutter-apk/app-release.apk\"}"
      fi
      release-cli upload \
        --tag-name "$TAG" \
        --assets-link "{\"name\":\"talk-to-me-espanol.apk\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/app/build/app/outputs/flutter-apk/app-release.apk\"}" \
        --assets-link "{\"name\":\"app-release.apk.sig\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/app-release.apk.sig\"}" \
        --assets-link "{\"name\":\"sbom-project.cdx.json\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/sbom-project.cdx.json\"}" \
        --assets-link "{\"name\":\"sbom-project.cdx.json.sig\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/sbom-project.cdx.json.sig\"}" \
        --assets-link "{\"name\":\"sbom-es-apk.cdx.json\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/sbom-es-apk.cdx.json\"}" \
        --assets-link "{\"name\":\"provenance.intoto.jsonl\",\"url\":\"${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/provenance.intoto.jsonl\"}"
  artifacts:
    paths:
      - app/build/app/outputs/flutter-apk/app-release.apk
      - app-release.apk.sig
      - sbom-project.cdx.json
      - sbom-project.cdx.json.sig
      - sbom-es-apk.cdx.json
      - provenance.intoto.jsonl
    expire_in: 90 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

# ────────────────────────────────────────────────────────────────────────────
# STAGE 5: RELEASE (version tags only) - creates formal GitLab Release
# ────────────────────────────────────────────────────────────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  timeout: 10m
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "=== CREATING GITLAB RELEASE FOR $CI_COMMIT_TAG ==="
    - |
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(printf 'Release %s\n\n## Assets\n- Talk To Me Español APK\n- SBOMs (CycloneDX)\n- Cosign Signatures\n- SLSA Provenance' "$CI_COMMIT_TAG")" \
        --ref "$CI_COMMIT_SHA"
