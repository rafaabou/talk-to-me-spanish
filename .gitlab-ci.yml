# GitLab CI/CD Pipeline for Talk To Me Spanish
# Full DevSecOps Pipeline with all security stages embedded in build

stages:
  - validate
  - build
  - scan
  - package
  - release

variables:
  FLUTTER_VERSION: "3.29.3"
  JAVA_VERSION: "17"
  ANDROID_SDK_VERSION: "35"
  ANDROID_NDK_VERSION: "27.0.12077973"
  FLUTTER_CHANNEL: "stable"

  # Cache configuration
  FLUTTER_CACHE_KEY: "flutter-es-${CI_PROJECT_ID}-${CI_COMMIT_REF_SLUG}"
  GRADLE_CACHE_KEY: "gradle-${CI_PROJECT_ID}-${CI_COMMIT_REF_SLUG}"

  # Security thresholds
  FAIL_ON_SEVERITY: "high"
  MOBSF_FAIL_ON: "critical,high"

  # Artifact expiration
  ARTIFACT_EXPIRE_VALIDATION: "1 week"
  ARTIFACT_EXPIRE_BUILD: "1 week"
  ARTIFACT_EXPIRE_SCAN: "4 weeks"
  ARTIFACT_EXPIRE_RELEASE: "90 days"

# =============================================================================
# BEFORE SCRIPT - Common setup for all jobs
# =============================================================================
before_script: &before_script
  - apt-get update -qq && apt-get install -y -qq openjdk-17-jdk-headless unzip curl git python3 python3-pip 2>/dev/null | tail -5
  - export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
  - export PATH="$JAVA_HOME/bin:$PATH"
  - |
    if [ ! -d "/opt/flutter" ]; then
      curl -sL "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" | tar xJ -C /opt
    fi
  - export PATH="/opt/flutter/bin:$PATH"
  - flutter config --no-analytics
  - flutter doctor -v

# =============================================================================
# CACHE CONFIGURATION
# =============================================================================
cache:
  key: "${CI_PROJECT_ID}-flutter-es-${CI_COMMIT_REF_SLUG}"
  paths:
    - /root/.pub-cache/
    - /root/.flutter/
    - /root/.gradle/
    - /opt/flutter/
  policy: pull-push

# =============================================================================
# STAGE 1: VALIDATE
# =============================================================================
validate:
  stage: validate
  image: ubuntu:22.04
  timeout: 15m
  before_script:
    - *before_script
  script:
    - echo "=== FORMAT CHECK ==="
    - cd app && dart format --set-exit-if-changed --output=none .

    - echo "=== STATIC ANALYSIS ==="
    - cd app && flutter analyze --fatal-infos --output=analysis-report.json

    - echo "=== LICENSE CHECK ==="
    - cd app && dart pub global activate license_checker
    - cd app && dart pub global run license_checker:lic_ck check-licenses --config lic_ck.yaml || echo "License check completed with findings"

    - echo "=== SECRET SCAN (GITLEAKS) ==="
    - |
      curl -sL "https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_Linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
      cd .. && gitleaks detect --source . --verbose --config .gitleaks.toml --no-git

    - echo "=== SECRET SCAN (TRUFFLEHOG) ==="
    - |
      curl -sL "https://github.com/trufflesecurity/trufflehog/releases/latest/download/trufflehog_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin trufflehog
      cd .. && trufflehog filesystem . --fail --no-verification

    - echo "=== DEPENDENCY AUDIT ==="
    - cd app && flutter pub outdated --json > deps-outdated.json || true
    - cat deps-outdated.json

  artifacts:
    reports:
      sast: app/analysis-report.json
    paths:
      - app/analysis-report.json
      - app/deps-outdated.json
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"

# =============================================================================
# STAGE 2: BUILD
# =============================================================================
build:
  stage: build
  image: ubuntu:22.04
  timeout: 30m
  needs: [validate]
  before_script:
    - *before_script
  script:
    - echo "=== GET DEPENDENCIES ==="
    - cd app && flutter pub get --enforce-lockfile

    - echo "=== RESTORE RELEASE KEYSTORE ==="
    - |
      if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
        echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/android/app/release.keystore
        ls -la app/android/app/release.keystore
      else
        echo "RELEASE_KEYSTORE_BASE64 not set - using debug signing"
      fi

    - echo "=== BUILD SPANISH APK ==="
    - cd app
    - flutter build apk --release --obfuscate --split-debug-info=build/debug-info --target-platform android-arm64

    - echo "=== VERIFY BUILD OUTPUTS ==="
    - ls -la app/build/app/outputs/flutter-apk/app-release.apk

    - echo "=== VERIFY MINIFICATION ==="
    - apkanalyzer manifest print app/build/app/outputs/flutter-apk/app-release.apk | grep "isMinifyEnabled=true" || exit 1

  artifacts:
    paths:
      - app/build/app/outputs/flutter-apk/app-release.apk
      - app/build/debug-info/
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

# =============================================================================
# STAGE 3: SECURITY SCANS (PARALLEL)
# =============================================================================
grype-scan:
  stage: scan
  image: anchore/grype:latest
  timeout: 20m
  needs: [build]
  script:
    - echo "=== GENERATE SBOM (SYFT) ==="
    - syft . -o cyclonedx-json=sbom-project.cdx.json
    - syft app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-es-apk.cdx.json

    - echo "=== VULNERABILITY SCAN (GRYPE) ==="
    - grype sbom:sbom-project.cdx.json --fail-on high --output json > grype-project-report.json
    - grype sbom:sbom-es-apk.cdx.json --fail-on high --output json > grype-es-report.json
  artifacts:
    reports:
      dependency_scanning: grype-project-report.json
    paths:
      - sbom-*.cdx.json
      - grype-*-report.json
    expire_in: 4 weeks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

trivy-scan:
  stage: scan
  image: aquasec/trivy:latest
  timeout: 20m
  needs: [build]
  script:
    - echo "=== TRIVY FS SCAN ==="
    - trivy fs --severity HIGH,CRITICAL --format sarif -o trivy-results.sarif .
    - trivy fs --severity HIGH,CRITICAL --format json -o trivy-results.json .
  artifacts:
    reports:
      sast: trivy-results.sarif
    paths:
      - trivy-results.sarif
      - trivy-results.json
    expire_in: 4 weeks
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

mobsf-scan:
  stage: scan
  image: python:3.11-slim
  timeout: 30m
  needs: [build]
  variables:
    MOBSF_API_KEY: $MOBSF_API_KEY
    MOBSF_URL: $MOBSF_URL
  before_script:
    - pip install requests --quiet
  script:
    - echo "=== MOBSF STATIC ANALYSIS ==="
    - |
      python3 << 'EOF'
      import requests
      import sys
      import time
      import os
      
      MOBSF_URL = os.getenv('MOBSF_URL', 'https://mobsf.example.com/api/v1')
      API_KEY = os.getenv('MOBSF_API_KEY')
      
      if not API_KEY:
          print("MOBSF_API_KEY not set, skipping MobSF scan")
          sys.exit(0)
      
      # Scan Spanish APK
      with open('app/build/app/outputs/flutter-apk/app-release.apk', 'rb') as f:
          files = {'file': ('talk-to-me-spanish.apk', f, 'application/vnd.android.package-archive')}
          headers = {'Authorization': API_KEY}
          resp = requests.post(f'{MOBSF_URL}/upload', files=files, headers=headers, timeout=60)
          if resp.status_code != 200:
              print(f"Upload failed: {resp.text}")
              sys.exit(1)
          es_hash = resp.json()['hash']
      
          # Scan Spanish
          scan_resp = requests.post(f'{MOBSF_URL}/scan', data={'hash': es_hash, 'scan_type': 'apk'}, headers={'Authorization': API_KEY}, timeout=60)
          if scan_resp.status_code != 200:
              print(f"Scan failed: {scan_resp.text}")
              sys.exit(1)
      
          # Wait for scan
          for _ in range(60):
              report_resp = requests.post(f'{MOBSF_URL}/report_json', data={'hash': es_hash}, headers={'Authorization': API_KEY}, timeout=30)
              if report_resp.status_code == 200:
                  break
              time.sleep(10)
      
          if report_resp.status_code != 200:
              print(f"Report failed: {report_resp.text}")
              sys.exit(1)
      
          report = report_resp.json()
          critical_high = [v for v in report.get('vulnerabilities', []) if v.get('severity') in ['critical', 'high']]
          if critical_high:
              print(f'CRITICAL/HIGH vulnerabilities found in Spanish app: {len(critical_high)}')
              for v in critical_high:
                  print(f'  - {v.get("title", "Unknown")}: {v.get("severity", "unknown")}')
              sys.exit(1)
          print('No CRITICAL/HIGH vulnerabilities found in Spanish app')
      EOF
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/
  when: manual
  allow_failure: true

# =============================================================================
# STAGE 4: PACKAGE & SIGN
# =============================================================================
package:
  stage: package
  image: ubuntu:22.04
  timeout: 15m
  needs: [build, grype-scan, trivy-scan]
  before_script:
    - *before_script
  script:
    - echo "=== VERIFY APK SIGNATURES ==="
    - apksigner verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk

    - echo "=== GENERATE SBOMs ==="
    - syft . -o cyclonedx-json=sbom-project.cdx.json
    - syft app/build/app/outputs/flutter-apk/app-release.apk -o cyclonedx-json=sbom-es-apk.cdx.json

    - echo "=== VULNERABILITY SCAN ON APK SBOMs ==="
    - grype sbom:sbom-es-apk.cdx.json --fail-on high

    - echo "=== SIGN WITH COSIGN (KEYLESS) ==="
    - cosign sign-blob --yes --output-signature app-release.apk.sig app/build/app/outputs/flutter-apk/app-release.apk
    - cosign sign-blob --yes --output-signature sbom-project.cdx.json.sig sbom-project.cdx.json

    - echo "=== GENERATE PROVENANCE (SLSA) ==="
    - slsa-verifier generate-provenance app/build/app/outputs/flutter-apk/app-release.apk --output provenance.intoto.jsonl

  artifacts:
    paths:
      - app/build/app/outputs/flutter-apk/app-release.apk
      - '''*.sig'''
      - '''sbom*.json'''
      - provenance.intoto.jsonl
    expire_in: 90 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG =~ /^v/

# =============================================================================
# STAGE 5: RELEASE (TAGGED RELEASES ONLY)
# =============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  timeout: 10m
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - echo "=== CREATING GITLAB RELEASE ==="
    - |
      release-cli create \
        --name "Release $CI_COMMIT_TAG" \
        --tag-name "$CI_COMMIT_TAG" \
        --description "$(printf 'Release %s\n\n## Artifacts\n- Talk To Me Spanish APK\n- SBOMs (CycloneDX)\n- Cosign Signatures\n- SLSA Provenance' \"$CI_COMMIT_TAG\")" \
        --assets-link "{\"name\":\"talk-to-me-spanish.apk\",\"url\":\"${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_SHA}/raw/app/build/app/outputs/flutter-apk/app-release.apk?job=package\"}"

# =============================================================================
# DEPENDENCY UPDATE (Scheduled)
# =============================================================================
dependency-update:
  stage: validate
  image: ubuntu:22.04
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - *before_script
    - echo "=== CHECKING FOR DEPENDENCY UPDATES ==="
    - cd app && flutter pub upgrade --major-versions --dry-run
  allow_failure: true