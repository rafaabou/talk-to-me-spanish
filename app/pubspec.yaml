name: talk_to_me_spanish
description: "Talk To Me Spanish By Mohamed Rafaa Tounekti"
publish_to: 'none'
version: 1.10.0+14

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  crypto: ^3.0.3
  path_provider: ^2.1.2
  timezone: ^0.9.2
  pdf: ^3.10.7
  fl_chart: ^0.68.0
  share_plus: ^12.0.2
  speech_to_text: ^7.0.0
  record: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
  assets:
    - assets/course/levels/
    - assets/course/index.json
    - assets/course/verbs.json
    - assets/audio/
    - assets/fonts/NotoSansPdf-Regular.ttf
    - assets/fonts/NotoSansPdf-Bold.ttf