<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talk To Me - Espanol</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #c0392b, #f39c12); }
.card { background: white; border-radius: 20px; padding: 40px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 420px; width: 90%; }
.flag { font-size: 60px; margin-bottom: 10px; }
h1 { color: #c0392b; font-size: 22px; margin-bottom: 4px; }
.sub { color: #888; font-size: 14px; margin-bottom: 6px; }
.ar { color: #666; font-size: 15px; direction: rtl; margin-bottom: 20px; }
.btn { display: block; width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; cursor: pointer; margin-bottom: 12px; transition: transform 0.1s; color: white; }
.btn:active { transform: scale(0.97); }
.btn1 { background: #e74c3c; }
.btn1:hover { background: #c0392b; }
.btn2 { background: #c0392b; }
.btn2:hover { background: #a93226; }
.btn3 { background: #8e44ad; }
.btn3:hover { background: #7d3c98; }
hr { border: none; border-top: 1px solid #eee; margin: 16px 0; }
.info { font-size: 12px; color: #999; margin-top: 8px; }
.note { background: #fff3cd; border: 1px solid #ffc107; border-radius: 10px; padding: 12px; margin-top: 16px; font-size: 12px; color: #856404; display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="flag">🇪🇸</div>
  <h1>Talk To Me</h1>
  <div class="sub">Espanol</div>
  <div class="ar">الإسبانية</div>
  <hr>
  <button class="btn btn1" onclick="window.open('http://localhost:8002','_blank')">Abrir App</button>
  <button class="btn btn2" onclick="window.open('http://localhost:8002','_blank')">Open App</button>
  <button class="btn btn3" onclick="window.open('http://localhost:8002','_blank')">فتح التطبيق</button>
  <div class="note" id="note">If the app does not open, start the server first:<br><code>bash start-server.sh</code></div>
  <div class="info">v1.10.0</div>
</div>
<script>
setTimeout(function(){
  var img = new Image();
  img.onerror = function(){ document.getElementById('note').style.display='block'; };
  img.src = 'http://localhost:8002/favicon.png?' + Date.now();
}, 500);
</script>
</body>
</html>
